# Release via annalist — auto on every push/merge to main (trunk flow).
#
# How it works:
#   1. On every push to `main`, the next version is auto-bumped from commits
#      since the last tag (conventional commits:
#      BREAKING CHANGE/feat! -> major, feat -> minor, else patch). Dispatch
#      with a `version` or `bump` input to override.
#   2. The tag is created and pushed (skipped if it already exists).
#   3. The Docker image is built and pushed at that exact tag.
#   4. The GitHub release is created ONCE.
#
# Notes are NOT generated by this workflow. The annalist GitHub App (installed
# on this repo) receives the release webhook and fills the release body with
# generated notes.
#
# Re-runs are idempotent: a partial failure can be re-dispatched and the same
# (already-existing) tag/release/docker-image guards no-op or complete the work.
#
# Only required secret: GITHUB_TOKEN (auto-provided; permissions: contents: write).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:                       # manual override
        description: "Explicit version (vX.Y.Z). Empty = auto-bump from commits."
        required: false
        default: ""
      bump:
        description: "Bump level when version is empty: auto|patch|minor|major"
        required: false
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so version resolution can inspect all refs.
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ inputs.version }}"
          BUMP_INPUT="${{ inputs.bump }}"

          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | head -n 1 || true)

          if [ -n "$VERSION_INPUT" ]; then
            # Manual override
            NEW_VERSION="${VERSION_INPUT#v}"
            if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version input: ${VERSION_INPUT} (expected vX.Y.Z)"
              exit 1
            fi
            NEW_VERSION="v${NEW_VERSION}"
          elif [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            MAJOR="${LATEST_TAG#v}"; MAJOR="${MAJOR%%.*}"
            REST="${LATEST_TAG#v*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"

            case "$BUMP_INPUT" in
              auto|"")
                if [ -z "$(git log --format=%H "${LATEST_TAG}..HEAD" 2>/dev/null)" ]; then
                  # Re-run after a partial failure: the tag sits at HEAD. Reuse
                  # it as the target so the release step completes it (or
                  # no-ops if it already exists).
                  PREV_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | sed -n 2p || true)
                  echo "new_version=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
                  echo "previous_tag=${PREV_TAG:-}" >> "$GITHUB_OUTPUT"
                  echo "No commits since ${LATEST_TAG} — reusing it"
                  exit 0
                fi
                LOG=$(git log --format=%B "${LATEST_TAG}..HEAD" 2>/dev/null || true)
                if echo "$LOG" | grep -qE 'BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!: '; then LEVEL=major
                elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?: '; then LEVEL=minor
                else LEVEL=patch; fi
                ;;
              patch|minor|major) LEVEL="$BUMP_INPUT" ;;
              *) echo "Invalid bump input: ${BUMP_INPUT} (auto|patch|minor|major)"; exit 1 ;;
            esac

            case "$LEVEL" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
            esac
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${LATEST_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_VERSION} (previous: ${LATEST_TAG:-none})"

      # Go manifest bump = no-op. Go carries no project version in go.mod — the
      # git tag is the only version. The binary version is stamped at docker
      # build time via `-ldflags -X` (see the docker step below); the tag-head
      # is the release HEAD, so the `-ldflags` build uses the tag.

      - name: Create and push tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Dockerfile must declare `ARG VERSION` — it does not yet (follow-up). To
      # stamp the Go binary into the backend stage, add `ARG VERSION=devel` to
      # `FROM golang:1.26-alpine AS backend-builder` and change the build to
      # `go build -tags webui -ldflags "-w -s -X github.com/djdembeck/annalist/cmd/annalist.Version=${VERSION}"`
      # — or point `-X` at a future version var (no `internal/version` package
      # exists yet). Until then the build arg is unconsumed and produces only a
      # Docker warning; the image is still versioned by its tag.

      - name: Build and push Docker image
        id: docker
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if [ "${{ steps.tag.outputs.created }}" = "true" ] || ! docker manifest \
            inspect "ghcr.io/djdembeck/annalist:${VERSION}" >/dev/null 2>&1; then
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker build --build-arg VERSION="${VERSION}" -t "ghcr.io/djdembeck/annalist:${VERSION}" .
            docker push "ghcr.io/djdembeck/annalist:${VERSION}"
            echo "✓ Pushed ghcr.io/djdembeck/annalist:${VERSION}"
          else
            echo "Image ghcr.io/djdembeck/annalist:${VERSION} already exists — skipping push"
          fi

      # Notes are filled by the annalist GitHub App via the release webhook
      # (`release: published`/`created`, non-draft) — this workflow only creates
      # the release.
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists — nothing to do"
            exit 0
          fi
          gh release create "${VERSION}" \
            --title "Release ${VERSION}"
          echo "✓ Release ${VERSION} created (notes filled by the annalist app)"
