# annalist — local dev environment
#
#   docker compose -f docker-compose.dev.yml up
#
# Frontend: http://localhost:5174  (Vite, hot-reload)
# Backend:  http://localhost:8081  (Go, recompile on save via fly)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - ADMIN_TOKEN=dev
      - DATA_DIR=/app/data
    volumes:
      - .:/app/src
      - annalist-dev-data:/app/data

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    environment:
      - DEV_API_PROXY=http://backend:8081
      - VITE_PORT=5174
    volumes:
      - ./web:/build/web
    depends_on:
      - backend

volumes:
  annalist-dev-data:
