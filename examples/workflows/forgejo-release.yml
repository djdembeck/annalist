# Generate-first release via annalist (Forgejo / Gitea).
#
# Copy to YOUR repo:  .forgejo/workflows/release.yml
#
# One repo-owned release workflow. The automatic path (release-branch push)
# and the deliberate manual path (workflow_dispatch) share the entire body.
# The reservation / completion / notes contract is identical to the GitHub
# example (examples/workflows/github-release.yml); only the release API and
# the concurrency mechanics differ.
#
# Model (immutable, create-only version reservation):
#   1. A mutation-free preflight freezes the single source SHA for the
#      invocation and rejects a wrong-branch dispatch before reserve or
#      publish runs. Forgejo v17 ignores job permissions; its automatic
#      token is write-capable even here, unlike the GitHub example's
#      read-scoped preflight. Do not treat this as credential isolation.
#   2. The version is decided from the highest valid semver-ish tag
#      reachable from the frozen SHA — INCLUDING unfinished reservations.
#      A failed number stays reserved; it is never recirculated as if it
#      never existed.
#   3. If the decided tag already points EXACTLY at the frozen source, the
#      reservation is REUSED (rerun of the same source, even after newer
#      releases exist) — tagged by ancestry, not by "highest".
#   4. The number is reserved IMMEDIATELY as an annotated tag built against
#      the exact frozen SHA (create-only; a tag is never moved, force-
#      pushed, or deleted by this workflow).
#   5. An existing tag is NOT completion. The publish job re-verifies
#      tag -> frozen source, then reads the release state with ONE
#      authoritative metadata lookup (body + draft). A completed release
#      (published, nonempty notes) no-ops without any generation; a draft
#      is explicitly published once the notes are ready; a failed
#      metadata read fails the step — it is never treated as "no release"
#      and cannot overwrite existing notes.
#
# Release notes: notes are generated via the annalist generate API
# (publish: false) ONLY when the release is missing or incomplete (draft
# / empty body), and a new tag creates the release in a single request.
# The notes range is the annalist `range_policy: previous_published`
# resolution — the previous PUBLISHED non-draft ancestor release, full
# history for the first published release. `from_tag` is deliberately
# OMITTED here: passing the previous reachable tag would reproduce the
# unfinished-reservation bug (an unreleased tag hides changes behind it).
# An existing nonempty body is preserved verbatim; a failed release-state
# read (403/500/network) fails the step (fail-closed) — a completed
# release's rerun never hits Annalist at all.
#
# Concurrency: group `release`, cancel-in-progress: false. Forgejo's
# concurrency is best-effort and deliberately does NOT copy GitHub's
# `queue:` key (the installed instance's behavior is what matters, not
# guessed parity). BEFORE enabling the combined push + dispatch mode,
# prove on the installed instance that a queued manual dispatch survives
# later pushes; until that retention proof exists, keep the repo's
# current verified flow rather than assuming queued-run retention.
#
# Re-runs are idempotent: a partial failure can be re-dispatched (or the
# release branch re-pushed) and the same tag/release guards no-op or
# complete the work.
#
# Requires repo secret:
#   ANNALIST_ADMIN_TOKEN   (the annalist ADMIN_TOKEN; protects the /api/* routes)
# Forgejo supplies the repository-scoped, write-capable FORGEJO_TOKEN
# automatically. Job-level permissions cannot narrow it on v17.

name: Release

on:
  # Automatic mode: release-branch promotion pushes. For a manual-only
  # repository, DELETE this block — the workflow_dispatch block below then
  # stands alone (run it from Forgejo Actions on the release branch).
  push:
    branches: [main]                 # or: [develop] if that is the release branch
    # Release only on code changes — CI/docs-only merges must not bump or cut.
    paths-ignore: ['*.md', 'docs/**', '.forgejo/**']
  workflow_dispatch:
    inputs:
      version:                       # manual override
        description: "Explicit version (vX.Y.Z). Empty = auto-bump from commits."
        required: false
        default: ""
      bump:
        description: "Bump level when version is empty: auto|patch|minor|major"
        required: false
        default: auto

env:
  ANNALIST_URL: https://annalist.example.com    # <- your annalist instance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---- Mutation-free decision stage. Forgejo ignores job permissions and
  # exposes its write-capable automatic token in every job; this is NOT a
  # credential-isolation boundary. Reject the wrong ref before reserve/publish.
  preflight:
    name: Freeze source SHA and decide version (no mutations)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so version resolution can inspect all refs.
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze source SHA
        id: freeze
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release must run on main; refusing this ref before reservation"
            exit 1
          fi
          # Both triggers and retries use the immutable event SHA, not a moving branch.
          SHA="$GITHUB_SHA"
          # Read-only sanity: the frozen object exists in this clone.
          git cat-file -e "${SHA}^{commit}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - name: Decide version (decision only; the reservation job creates)
        id: decide
        run: |
          set -euo pipefail
          SHA="${{ steps.freeze.outputs.sha }}"
          VERSION_INPUT="${{ inputs.version }}"
          BUMP_INPUT="${{ inputs.bump }}"

          # Inspect every valid stable reservation reachable from this source.
          # Its existing identity wins even when an ancestor has a higher tag.
          VERSION_PATTERN='^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'
          TAGS="$(git tag -l --merged "${SHA}")"
          VALID_TAGS=()
          SAME_SOURCE_TAG=""
          while IFS= read -r TAG; do
            [[ "${TAG}" == v* && "${TAG#v}" =~ ${VERSION_PATTERN} ]] || continue
            VALID_TAGS+=("${TAG}")
            TAG_SHA="$(git rev-parse --verify "${TAG}^{commit}")"
            if [ "${TAG_SHA}" = "${SHA}" ]; then
              if [ -n "${SAME_SOURCE_TAG}" ]; then
                echo "::error::Ambiguous source: ${SAME_SOURCE_TAG} and ${TAG} both reserve ${SHA}"
                exit 1
              fi
              SAME_SOURCE_TAG="${TAG}"
            fi
          done <<< "${TAGS}"
          BASELINE_TAG=""
          if ((${#VALID_TAGS[@]})); then
            BASELINE_TAG="$(printf '%s\n' "${VALID_TAGS[@]}" | sort -V | tail -n 1)"
          fi

          # Explicit version override (manual dispatch). Normalized to vX.Y.Z.
          if [ -n "${VERSION_INPUT}" ]; then
            NEW_VERSION="${VERSION_INPUT#v}"
            if ! [[ "${NEW_VERSION}" =~ ${VERSION_PATTERN} ]]; then
              echo "::error::Invalid version input: ${VERSION_INPUT} (expected vX.Y.Z)"
              exit 1
            fi
            if [ -n "${SAME_SOURCE_TAG}" ] && [ "v${NEW_VERSION}" != "${SAME_SOURCE_TAG}" ]; then
              echo "::error::Source ${SHA} is already reserved as ${SAME_SOURCE_TAG}; refusing a second version"
              exit 1
            fi
            echo "version=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            echo "decided_version=v${NEW_VERSION} (manual override)"
            exit 0
          fi

          # A retry reuses this source's identity, not the highest ancestor tag.
          if [ -n "${SAME_SOURCE_TAG}" ]; then
            echo "version=${SAME_SOURCE_TAG}" >> "$GITHUB_OUTPUT"
            echo "decided_version=${SAME_SOURCE_TAG} (reservation reuse: exact frozen source)"
            exit 0
          fi

          if [ -z "${BASELINE_TAG}" ]; then
            echo "version=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "decided_version=v0.1.0 (first release)"
            exit 0
          fi

          MAJOR="${BASELINE_TAG#v}"; MAJOR="${MAJOR%%.*}"
          REST="${BASELINE_TAG#v*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          case "${BUMP_INPUT}" in
            patch|minor|major) LEVEL="${BUMP_INPUT}" ;;
            auto|"")
              LOG="$(git log --format=%B "${BASELINE_TAG}..${SHA}" 2>/dev/null || true)"
              if echo "${LOG}" | grep -qE 'BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!: '; then LEVEL=major
              elif echo "${LOG}" | grep -qE '^feat(\([^)]*\))?: '; then LEVEL=minor
              else LEVEL=patch; fi
              ;;
            *) echo "::error::Invalid bump input: ${BUMP_INPUT} (auto|patch|minor|major)"; exit 1 ;;
          esac
          case "${LEVEL}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "version=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "decided_version=v${MAJOR}.${MINOR}.${PATCH} (baseline ${BASELINE_TAG}, ${LEVEL} bump)"

  # ---- The ONLY writer of the exact-SHA version reservation.
  # persist-credentials: true is scoped to THIS checkout's local .git
  # config and removed by the checkout post step — no token on argv, no
  # host-global config. git push/fetch use the origin remote that checkout
  # configured with those local credentials; nothing is passed on argv.
  reserve:
    needs: preflight
    if: needs.preflight.outputs.version != ''
    name: Reserve the version at the exact source (create-only)
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.reserve.outputs.reused }}
    steps:
      - name: Checkout frozen source (full history)
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Create-only exact-SHA reservation
        id: reserve
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          SHA="${{ needs.preflight.outputs.sha }}"

          # Origin carries the checkout's persisted credentials
          # (this job's local .git config only), so no token on argv.
          # A reservation that only exists REMOTELY (another runner
          # reserved it between this run's fetch and now) is fetched
          # explicitly — by exact ref, never by number, never rewritten.
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            git fetch --quiet origin "refs/tags/${VERSION}:refs/tags/${VERSION}" || true
          fi

          TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" || true)"
          if [ -n "${TAG_COMMIT}" ]; then
            if [ "${TAG_COMMIT}" = "${SHA}" ]; then
              echo "reused=true" >> "$GITHUB_OUTPUT"
              echo "Reservation ${VERSION} reused: tag already points at ${SHA}"
            else
              echo "::error::version collision: ${VERSION} is reserved at ${TAG_COMMIT}, this invocation requires ${SHA} — refusing to move the tag"
              exit 1
            fi
          else
            # Create the reservation: annotated tag ON the exact frozen SHA.
            # No force, no delete — create-only by construction.
            git -c user.name="forgejo-actions[bot]" \
                -c user.email="forgejo-actions[bot]@users.noreply.invalid" \
                tag -a "${VERSION}" "${SHA}" -m "Release ${VERSION}"
            if ! git push --dry-run origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
              # A competing actor created the ref between check and create.
              git fetch --quiet origin "refs/tags/${VERSION}:refs/tags/${VERSION}" || true
              TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" || true)"
              if [ "${TAG_COMMIT}" != "${SHA}" ]; then
                echo "::error::version collision: ${VERSION} appeared at ${TAG_COMMIT} between check and create; this invocation requires ${SHA} — refusing to move the tag"
                exit 1
              fi
            fi
            git push origin "refs/tags/${VERSION}"
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "Reservation created: ${VERSION} -> ${SHA}"
          fi

  # ---- Publish: re-verify the reservation, create the release ONCE with
  # complete notes, resume missing notes on rerun.
  publish:
    needs: [preflight, reserve]
    name: Publish the release (once; resume on partial failure)
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.verify.outputs.source }}
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout frozen source (full history)
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Re-verify reservation points at the frozen source
        id: verify
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.version }}"
          SHA="${{ needs.preflight.outputs.sha }}"
          REPO_FULL="${{ github.repository }}"
          TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" || true)"
          if [ -z "${TAG_COMMIT}" ]; then
            echo "::error::tag ${VERSION} is missing at publish time — refusing to publish (create-only model)"
            exit 1
          fi
          if [ "${TAG_COMMIT}" != "${SHA}" ]; then
            echo "::error::version collision: ${VERSION} is reserved at ${TAG_COMMIT}, publish requires ${SHA}"
            exit 1
          fi
          echo "source=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          ANNALIST_ADMIN_TOKEN: ${{ secrets.ANNALIST_ADMIN_TOKEN }}
          VERSION: "${{ needs.preflight.outputs.version }}"
        run: |
          set -euo pipefail
          VERSION="${VERSION}"
          REPO_FULL="${{ github.repository }}"
          OWNER="${REPO_FULL%/*}"
          REPO="${REPO_FULL#*/}"
          REPO_API="${{ github.server_url }}/api/v1/repos/${REPO_FULL}"

          # One authoritative release lookup BEFORE any decision (the
          # tags endpoint doubles as body + draft + id provider). Any
          # unexpected status (403/500/network) fails the step — a failed
          # read is never treated as "no release", so existing notes can
          # never be overwritten on a swallowed lookup error.
          REL_JSON=""
          HTTP_OK=0
          HTTP=""
          curl -sS -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${REPO_API}/releases/tags/${VERSION}" > /tmp/http_code \
            || { echo "Release state check for ${VERSION} failed (transport)" >&2; exit 1; }
          HTTP="$(cat /tmp/http_code)"
          case "$HTTP" in
          200)
            REL_JSON="$(cat /tmp/release.json)"
            HTTP_OK=1
            ;;
          404)
            :   # no release for this tag: open create path.
            ;;
          *)
            echo "Unexpected status ${HTTP} checking release ${VERSION}" >&2
            exit 1
            ;;
          esac
          BODY=""
          IS_DRAFT="false"
          RELEASE_ID=""
          if [ "$HTTP_OK" -eq 1 ]; then
            BODY="$(jq -r '.body // empty' <<<"${REL_JSON}")"
            IS_DRAFT="$(jq -r .draft <<<"${REL_JSON}")"
            RELEASE_ID="$(jq -r .id <<<"${REL_JSON}")"
          fi

          if [ -n "${BODY}" ] && [ "${IS_DRAFT}" = "false" ]; then
            # A published release with nonempty notes IS completion (a tag
            # alone is NOT): preserve the existing body, no-op — no
            # regeneration, no annotation.
            echo "Release ${VERSION} already complete — nothing to do"
            exit 0
          fi

          # Optional: a named release-note profile (see the GitHub example):
          #   NOTES_CUSTOMER=$(curl -fsS -X POST "${ANNALIST_URL}/api/repos/forgejo/${OWNER}/${REPO}/generate" \
          #     -H "Authorization: Bearer ${ANNALIST_ADMIN_TOKEN}" \
          #     -H "Content-Type: application/json" \
          #     -d "{\"to_tag\":\"${VERSION}\",\"range_policy\":\"previous_published\",\"profile\":\"customer\",\"display_version\":\"${VERSION#v}\",\"publish\":false}" | jq -r .notes)

          # Optional: build and push your container image here. For
          # idempotent reruns guard with a manifest inspect, e.g.:
          #   if ! docker manifest inspect "${REGISTRY}:${VERSION}" >/dev/null 2>&1; then
          #     docker build --build-arg VERSION="${VERSION}" --build-arg GIT_COMMIT="${{ needs.preflight.outputs.sha }}" \
          #       -t "${REGISTRY}:${VERSION}" .
          #     docker push "${REGISTRY}:${VERSION}"
          #   fi

          # Notes are generated only when the release is incomplete
          # (tag-only, draft, or empty body): a completed release makes no
          # LLM call, and a resume refills what is missing without touching
          # a human-edited body.
          NOTES=""
          if [ -z "${BODY}" ]; then
            # The notes range is the previous PUBLISHED non-draft,
            # non-prerelease ancestor release — full history for the first
            # published release — so an unfinished reservation cannot hide
            # unreleased changes. from_tag is intentionally omitted.
            NOTES="$(curl -fsS -X POST "${ANNALIST_URL}/api/repos/forgejo/${OWNER}/${REPO}/generate" \
              -H "Authorization: Bearer ${ANNALIST_ADMIN_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"to_tag\":\"${VERSION}\",\"range_policy\":\"previous_published\",\"publish\":false}" | jq -r .notes)"
          fi

          if [ "$HTTP_OK" -eq 1 ] && [ "${IS_DRAFT}" = "true" ]; then
            # Existing draft (an earlier rerun, or a left-over draft):
            # refill missing notes if needed, then publish the draft
            # explicitly (the field flip and the notes go to the API in
            # one request).
            if [ -z "${BODY}" ]; then
              curl -fsS -X PATCH "${REPO_API}/releases/${RELEASE_ID}" \
                -H "Authorization: token ${FORGEJO_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg n "${NOTES}" '{body:$n,draft:false}')"
              echo "Release ${VERSION} draft was empty — refilled notes and published"
            else
              curl -fsS -X PATCH "${REPO_API}/releases/${RELEASE_ID}" \
                -H "Authorization: token ${FORGEJO_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"draft":false}'
              echo "Release ${VERSION} draft was ready — published with existing notes"
            fi
          elif [ "$HTTP_OK" -eq 1 ]; then
            # Published release with an empty body: resume by refilling it.
            curl -fsS -X PATCH "${REPO_API}/releases/${RELEASE_ID}" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg n "${NOTES}" '{body:$n}')"
            echo "Release ${VERSION} existed with empty notes — refilled"
          else
            # First post: create the release ONCE with the complete body.
            curl -fsS -X POST "${REPO_API}/releases" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg v "${VERSION}" --arg n "${NOTES}" '{tag_name:$v,name:("Release "+$v),body:$n,draft:false,prerelease:false}')"
            echo "Release ${VERSION} created with complete notes"
          fi
