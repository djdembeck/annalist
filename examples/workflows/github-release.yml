# Generate-first release via annalist (GitHub Actions).
#
# Copy to YOUR repo:  .github/workflows/release.yml
#
# How it works:
#   1. On every push to the trigger branch, the next version is auto-bumped
#      from commits since the last tag (conventional commits:
#      BREAKING CHANGE/feat! -> major, feat -> minor, else patch). Dispatch
#      with a `version` or `bump` input to override.
#   2. The tag is created and pushed (skipped if it already exists).
#   3. Complete notes are generated BEFORE the release exists, by calling the
#      annalist generate API with `publish: false`.
#   4. The release is created ONCE with the full body, via the gh CLI.
#
# Re-runs are idempotent: a partial failure can be re-dispatched and the same
# (already-existing) tag/release guards no-op or complete the work.
#
# Language- and framework-neutral: only git, gh, curl and jq are required, so
# it drops into any repository type.
#
# Requires the repo secret:
#   ANNALIST_ADMIN_TOKEN   (the annalist ADMIN_TOKEN; protects the /api/* routes)
# GITHUB_TOKEN is provided automatically (permissions: contents: write).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:                       # manual override
        description: "Explicit version (vX.Y.Z). Empty = auto-bump from commits."
        required: false
        default: ""
      bump:
        description: "Bump level when version is empty: auto|patch|minor|major"
        required: false
        default: auto

env:
  ANNALIST_URL: https://annalist.example.com    # <- your annalist instance

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so version resolution can inspect all refs.
          fetch-depth: 0

      - name: Configure Git
        ## Annotated tags need a git identity; the runner ships none.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          VERSION_INPUT="${{ inputs.version }}"
          BUMP_INPUT="${{ inputs.bump }}"

          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | head -n 1 || true)

          if [ -n "$VERSION_INPUT" ]; then
            # Manual override
            NEW_VERSION="${VERSION_INPUT#v}"
            if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version input: ${VERSION_INPUT} (expected vX.Y.Z)"
              exit 1
            fi
            NEW_VERSION="v${NEW_VERSION}"
          elif [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            MAJOR="${LATEST_TAG#v}"; MAJOR="${MAJOR%%.*}"
            REST="${LATEST_TAG#v*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"

            case "$BUMP_INPUT" in
              auto|"")
                if [ -z "$(git log --format=%H "${LATEST_TAG}..HEAD" 2>/dev/null)" ]; then
                  # Re-run after a partial failure: the tag sits at HEAD. Reuse
                  # it as the target so the release step completes it (or
                  # no-ops if it already exists).
                  PREV_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | sed -n 2p || true)
                  echo "new_version=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
                  echo "previous_tag=${PREV_TAG:-}" >> "$GITHUB_OUTPUT"
                  echo "No commits since ${LATEST_TAG} — reusing it"
                  exit 0
                fi
                LOG=$(git log --format=%B "${LATEST_TAG}..HEAD" 2>/dev/null || true)
                if echo "$LOG" | grep -qE 'BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!: '; then LEVEL=major
                elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?: '; then LEVEL=minor
                else LEVEL=patch; fi
                ;;
              patch|minor|major) LEVEL="$BUMP_INPUT" ;;
              *) echo "Invalid bump input: ${BUMP_INPUT} (auto|patch|minor|major)"; exit 1 ;;
            esac

            case "$LEVEL" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
            esac
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${LATEST_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_VERSION} (previous: ${LATEST_TAG:-none})"

      - name: Create and push tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Optional: build and push your container image here. For idempotent
      # re-runs, guard with a manifest inspect, e.g.:
      #   if [ "${{ steps.tag.outputs.created }}" = "true" ] || ! docker manifest \
      #     inspect "${REGISTRY}:${VERSION}" >/dev/null 2>&1; then
      #     docker build -t "${REGISTRY}:${VERSION}" .
      #     docker push "${REGISTRY}:${VERSION}"
      #   fi

      - name: Generate notes and create release (complete on first post)
        env:
          GH_TOKEN: ${{ github.token }}
          ANNALIST_ADMIN_TOKEN: ${{ secrets.ANNALIST_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          PREV="${{ steps.version.outputs.previous_tag }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          # Already released? (the tag may pre-exist from an earlier partial run)
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists — nothing to do"
            exit 0
          fi

          # Generate complete notes first — publish=false needs no release to exist.
          NOTES=$(curl -fsS -X POST "${ANNALIST_URL}/api/repos/github/${OWNER}/${REPO}/generate" \
            -H "Authorization: Bearer ${ANNALIST_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"to_tag\":\"${VERSION}\",\"from_tag\":\"${PREV}\",\"publish\":false}" | jq -r .notes)

          # Create the release once, with the full body.
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes "${NOTES}"
          echo "✓ Release ${VERSION} created with complete notes"
