# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands. A git commit --no-verify bypass is still caught by ci.yml.

repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: Go fmt
        entry: bash -c 'out=$(gofmt -s -l .) && if [ -n "$out" ]; then echo "Unformatted files:$out" && exit 1; fi'
        language: system
        types: [go]
        pass_filenames: false

      - id: goimports
        name: Go imports
        entry: bash -c 'go install golang.org/x/tools/cmd/goimports@latest && out=$(goimports -l .) && if [ -n "$out" ]; then echo "Import formatting needed:$out" && exit 1; fi'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-build
        name: Go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: Go test
        entry: go test -count=1 ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: svelte-check
        name: Svelte check
        entry: bash -c 'cd web && bun run check'
        language: system
        types: [file]
        files: ^web/
        pass_filenames: false

      - id: bun-build
        name: Bun build
        entry: bash -c 'cd web && bun run build'
        language: system
        types: [file]
        files: ^web/
        pass_filenames: false
